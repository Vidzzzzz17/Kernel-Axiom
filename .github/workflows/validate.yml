name: Validate desktop agent
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: node --test scripts/computer.test.mjs
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_KERNEL_REMOTE_URL: ${{ vars.VITE_KERNEL_REMOTE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: Kernel-Axiom-Windows
          path: release/*.exe
          if-no-files-found: error
