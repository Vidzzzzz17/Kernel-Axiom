name: Validate desktop agent
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: node --test scripts/computer.test.mjs
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun run electron:compile
