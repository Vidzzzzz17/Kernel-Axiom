appId: com.kernelaxiom.app
productName: Kernel Axiom
directories:
  output: release
  buildResources: build
files:
  - dist/client/**
  - dist-electron/**
  - build/icon.png
  - build/tray.png
  - package.json
extraMetadata:
  main: dist-electron/main.cjs
asarUnpack:
  - dist-electron/computer.ps1
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kernel Axiom
publish:
  provider: github
  owner: Vidzzzzz17
  repo: Kernel-Axiom

